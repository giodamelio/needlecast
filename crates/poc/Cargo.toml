[package]
name = "needlecast-poc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "needlecast-poc"
path = "src/main.rs"

[dependencies]
needlecast-common = { path = "../common", features = ["user"] }
aya = "0.13"
aya-obj = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
env_logger = "0.11"
log = "0.4"
