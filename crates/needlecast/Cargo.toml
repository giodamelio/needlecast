[package]
name = "needlecast"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "needlecast"
path = "src/main.rs"

[features]
default = []
# Affordances the VM suites need to isolate one half of the system. Behind a feature rather than
# hidden flags, so the shipped binary cannot express any of them and no test-only path can become
# load bearing for the real thing.
testing = []

[dependencies]
needlecast-common = { path = "../common", features = ["user"] }
aya = "0.13"
aya-obj = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
env_logger = "0.11"
log = "0.4"
hkdf = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
base64 = "0.23"
defguard_wireguard_rs = "0.11"
signal-hook = "0.4"

[dev-dependencies]
serde_json = "1"
